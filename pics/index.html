<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pics · Kushal</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page page-wide">
      <a href="/" class="back">← home</a>
      <header class="pics-header">
        <h2>Pictures</h2>
        <p>
          I really enjoy taking quality (?) pictures when I travel. I hope you
          enjoy them as much as I do!
        </p>
      </header>

      <div class="gallery">
        <figure class="photo-card">
          <img src="./laguna-sunset.jpeg" />
          <figcaption>
            <p class="photo-desc">Laguna Beach, CA</p>
          </figcaption>
        </figure>

        <figure class="photo-card">
          <img src="./thailand-canopy.jpeg" />
          <figcaption>
            <p class="photo-desc">Thailand &lt;3</p>
          </figcaption>
        </figure>

        <figure class="photo-card">
          <img src="./sr71-blackbird.jpeg" />
          <figcaption>
            <p class="photo-desc">Early CIA version of the SR-71 Blackbird</p>
          </figcaption>
        </figure>

        <figure class="photo-card">
          <img src="./monkey-mother-baby.jpeg" />
          <figcaption>
            <p class="photo-desc">Cute baby monkey</p>
          </figcaption>
        </figure>

        <figure class="photo-card">
          <img src="./cherry-blossom-tokyo.jpeg" />
          <figcaption>
            <p class="photo-desc">Cherry Blossoms in Tokyo</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
